<style>
/* Concept: warehouse ledger. Calm grey-blue paper, deep teal for the one active thing, real rubber colours only as swatches. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface2:#f6f8f9; --line:#d9e0e4; --ink:#14212b; --muted:#5d6e7a;

  --bar:#7fb7b7;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif; --f-head:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#17222a; --surface2:#1c2a33; --line:#2b3b46; --ink:#e6eef2; --muted:#93a6b2;
  --accent:#5fc4c4; --accent-ink:#06191a; --accent-soft:#16393b; --warn:#f0a45c; --warn-soft:#3a2a17; --bar:#2f6f70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#17222a; --surface2:#1c2a33; --line:#2b3b46; --ink:#e6eef2; --muted:#93a6b2;
  --accent:#5fc4c4; --accent-ink:#06191a; --accent-soft:#16393b; --warn:#f0a45c; --warn-soft:#3a2a17; --bar:#2f6f70; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font:600 24px/1.2 var(--f-head);margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}

.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field label,.lbl{font:600 12px var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:6px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=date],input[type=number],input[type=month],input[type=text],input[type=password],select{width:100%;font:15px var(--f-body);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:6px}
.mini{font:500 12.5px var(--f-body);border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 9px;font-size:14px;cursor:pointer;user-select:none}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}

.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.55);flex:none}
.grp{font-size:12px;color:var(--muted);margin:2px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font:600 26px/1.2 var(--f-head);font-variant-numeric:tabular-nums}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.main .k{color:inherit;opacity:.85}
h2{font:600 16px var(--f-head);margin:0}
.head2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0}
tfoot td{font-weight:600;background:var(--surface2)}
td.zero{color:var(--muted);opacity:.55}
td.neg{color:var(--warn)}
td.pos{color:var(--accent)}
td.hit{background:var(--accent-soft);font-weight:600}
.barcell{width:34%;min-width:120px;text-align:left}
.bar{height:10px;background:var(--bar);border-radius:3px;min-width:1px}
.note{font-size:13px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.btn{font:500 14px var(--f-body);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.msg.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.msg.ok{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.entry input[type=number]{width:84px;text-align:right;padding:5px 7px}
.entry td,.entry th{padding:4px 6px}
</style>

<div class="wrap">

      <section class="panel">

        <div class="note" id="status"></div>

    </main>
  </div>

  <section id="view-e" class="panel" hidden>
    <div class="head2"><h2>เพิ่มหรือแก้ไขข้อมูลรายวัน</h2></div>

      <div class="field" style="width:170px"><label for="e-key">รหัสบันทึก</label><input type="password" id="e-key" autocomplete="off"></div>

    </div>
    <div class="scroll entry" id="e-grid"></div>
    <div id="e-check" class="msg">กรอกตัวเลขตามใบรายงาน ช่องว่างถือเป็น 0</div>
    <div class="row"><button class="btn" id="e-save">บันทึกวันนี้</button><button class="btn ghost" id="e-clear">ล้างช่อง</button></div>
    <div id="e-msg" class="note"></div>
  </section>
<section id="view-p" class="panel" hidden>
    <div class="head2"><h2>แผนผลิต (กรอกเอง เก็บใน Google Sheet)</h2></div>

    <div class="scroll entry" id="p-grid"></div>

    <div class="row"><button class="btn" id="p-save">บันทึก</button></div>
    <div id="p-msg" class="note"></div>
  </section>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbypdnmDNOXuOQ6rA74u2u4aryCA0j4UvW7NFGcCG2aslnaDXThjKuUxi8xnRBhtQ6VLQg/exec";
const SIZES=["8.5","9","9.5","10","10.5","11"];
// รูปแบบตามตารางแผนผลิต: [คีย์ในชีต (หู/พื้น), ชื่อแสดง, สีพื้นแถว Excel, สีตัวอักษร]
const TPL8=[["น้ำเงิน","สีน้ำเงิน","D6E4F5","1F4FD8"],["เขียว","สีเขียว","DDEEDD","1E7E34"],["แดง","สีแดง","F8D7DA","C62828"],["เหลือง","สีเหลือง","FFF2CC","B7791F"],["ขาว","สีขาว","F5F5F5","333333"],["ดำ","สีดำ","D9D9D9","000000"],["เทา","สีเทา","E8E8E8","666666"],["ดำ/ขาว","สีดำหน้าขาว","D9D9D9","000000"]];
const TPLS=[["เขียว/แดง","พื้นแดง หูเขียว","F8D7DA","333333"],["แดง/เขียว","พื้นเขียว หูแดง","DDEEDD","333333"],["เหลือง/แดง","พื้นแดง หูเหลือง","F8D7DA","333333"],["น้ำเงิน/ดำ","พื้นดำ หูน้ำเงิน","D9D9D9","333333"],["เขียว/ดำ","พื้นดำ หูเขียว","D9D9D9","333333"],["แดง/ดำ","พื้นดำ หูแดง","D9D9D9","333333"],["เหลือง/ดำ(พระ)","พื้นดำ หูเหลือง(พระ)","D9D9D9","333333"],["เหลือง/ดำ","พื้นดำ หูเหลือง(โควิด)","FFF9C4","333333"],["ขาว/ดำ","พื้นดำ หูขาว","D9D9D9","333333"],["เทา/ดำ","พื้นดำ หูเทา","D9D9D9","333333"],["น้ำเงิน/น้ำเงิน","น้ำเงินล้วน","D6E4F5","333333"],["แดง/แดง","แดงล้วน","F8D7DA","333333"],["โกโก้ล้วน","น้ำตาลล้วน","F0E4DA","333333"]];
const MAIN=TPL8.map(r=>r[0]), MIX=TPLS.map(r=>r[0]), ALL=MAIN.concat(MIX);
const LAB={}; TPL8.concat(TPLS).forEach(r=>LAB[r[0]]=r[1]);
const lab=c=>LAB[c]||c;
// แผนผลิตรายเดือน (คู่) จากไฟล์ Plan Production: ต.ค. 2569 = Detail 200_10-2026, พ.ย. 2569 = Detail 200_11-2026
// คีย์สี = หู/พื้น เหมือนในชีต เพิ่มเดือนใหม่ได้ที่นี่
const PLAN_BUILTIN={"2026-10":{"น้ำเงิน":[4932,56464,89840,101244,101254,64853],"เขียว":[36,10687,21661,21697,17855,8808],"แดง":[48,7911,21800,26662,19156,11257],"เหลือง":[0,558,0,23472,27106,11290],"ขาว":[0,8691,18212,24845,31190,17537],"ดำ":[0,1996,2963,11878,8296,4784],"เทา":[0,1469,12470,31257,32692,4639],"ดำ/ขาว":[0,0,0,0,0,0],"เขียว/แดง":[0,2160,3120,7440,5400,3000],"แดง/เขียว":[0,2400,3600,7440,5400,2040],"เหลือง/แดง":[0,4200,6600,5400,2040,0],"น้ำเงิน/ดำ":[0,0,0,0,0,0],"เขียว/ดำ":[0,0,0,0,0,0],"แดง/ดำ":[0,0,0,0,0,0],"เหลือง/ดำ(พระ)":[0,0,0,0,0,0],"ขาว/ดำ":[0,0,0,0,0,0],"เทา/ดำ":[0,0,0,0,0,0],"เหลือง/ดำ":[0,0,0,0,0,0],"น้ำเงิน/น้ำเงิน":[0,360,3000,4800,3840,2400],"แดง/แดง":[0,0,1800,2160,2280,2400],"โกโก้ล้วน":[0,0,3000,5400,4800,2400]},"2026-11":{"น้ำเงิน":[0,6074,39512,125400,147300,93960],"เขียว":[0,11640,23400,30600,27600,10200],"แดง":[0,12000,21600,38400,36000,12600],"เหลือง":[0,0,0,0,0,0],"ขาว":[3000,13200,21000,38400,33600,22200],"ดำ":[0,0,0,40800,37500,29400],"เทา":[0,0,0,0,0,0],"ดำ/ขาว":[0,600,6600,22680,18600,8000],"เขียว/แดง":[0,0,0,0,0,0],"แดง/เขียว":[0,0,0,0,0,0],"เหลือง/แดง":[0,0,0,1200,3360,2040],"น้ำเงิน/ดำ":[0,0,0,0,0,0],"เขียว/ดำ":[0,0,0,0,0,0],"แดง/ดำ":[0,0,0,0,0,0],"เหลือง/ดำ(พระ)":[0,0,0,0,0,0],"ขาว/ดำ":[0,0,0,0,0,0],"เทา/ดำ":[0,0,0,0,0,0],"เหลือง/ดำ":[0,1200,3000,4800,4800,1800],"น้ำเงิน/น้ำเงิน":[0,0,0,0,0,0],"แดง/แดง":[0,0,0,0,0,0],"โกโก้ล้วน":[0,0,0,0,0,0]}};
const HEX={"น้ำเงิน":"#1f4fd8","เขียว":"#1e9e4a","แดง":"#d62828","ดำ":"#1b1b1b","เหลือง":"#f2c200","ขาว":"#f6f6f6","เทา":"#8a8f98"};
const DOTS={"โกโก้ล้วน":"#6b4226"};
const MON=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const WD=["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
const $=id=>document.getElementById(id);
const fmt=n=>n?n.toLocaleString("en-US"):"–";
const thDate=iso=>{const d=new Date(iso+"T00:00:00");return WD[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+String((d.getFullYear()+543)%100)};
const thLong=iso=>{const d=new Date(iso+"T00:00:00");return d.getDate()+" "+MON[d.getMonth()]+" "+(d.getFullYear()+543)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let view="act", planSel={};
// ทำให้วันที่เป็น yyyy-mm-dd เสมอ แม้ชีตส่งมาเป็นข้อความอื่น (เช่น "Thu Oct 01 2026 ...")
const normD=v=>{v=String(v);if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);const d=new Date(v);return isNaN(d)?v:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const normM=v=>normD(v).slice(0,7);
const revName=r=>r===0?"(แผนเริ่มต้น)":"(revise ครั้งที่ "+r+")";
function buildPlans(rows){
  const P={};
  (rows||[]).forEach(r=>{const m=normM(r[0]),rev=Number(r[1])||0,c=r[2];
    P[m]=P[m]||{}; P[m][rev]=P[m][rev]||{colors:{},date:"",note:""};
    P[m][rev].colors[c]=[3,4,5,6,7,8].map(i=>Number(r[i])||0);
    if(r[9]) P[m][rev].date=normD(r[9]); if(r[10]) P[m][rev].note=String(r[10]);});
  Object.keys(PLAN_BUILTIN).forEach(m=>{P[m]=P[m]||{}; if(!P[m][0]) P[m][0]={colors:PLAN_BUILTIN[m],date:"",note:"จากไฟล์ Plan Production"}});
  return P;
}
let PLANS=buildPlans([]);
const revNum=m=>PLANS[m]?Object.keys(PLANS[m]).map(Number).sort((a,b)=>a-b):[];
function planMonths(f,t){const out=[];if(!f||!t)return out;let [y,m]=f.slice(0,7).split("-").map(Number);const [y2,m2]=t.slice(0,7).split("-").map(Number);
  while(y<y2||(y===y2&&m<=m2)){out.push(y+"-"+String(m).padStart(2,"0"));m++;if(m>12){m=1;y++}}return out}
const mLabel=k=>{const p=k.split("-");return MON[+p[1]-1]+" "+(+p[0]+543)};
function planMatrix(f,t){const pm={},have=[],miss=[],sel=[];ALL.forEach(c=>pm[c]=SIZES.map(()=>0));

$("xl").onclick=async()=>{
  const x=window.__x, b=$("xl"), back=()=>setTimeout(()=>b.textContent="ดาวน์โหลด Excel",2500);

    const f=x.fI||x.ds[0], t=x.tI||x.ds[x.ds.length-1], pm=x.pm, hasPlan=x.PM.have.length>0;

    x.ds.forEach(d=>ALL.filter(sel).forEach(c=>{const v=(docs[d].rows||{})[c]; if(!v) return; const vals=SIZES.map((s,i)=>x.si.includes(i)?(v[i]||0):0), s=vals.reduce((q,z)=>q+z,0); if(s){const r=w3.rowCount+1; w3.addRow([d,lab(c)].concat(vals,[{formula:"SUM(C"+r+":H"+r+")",result:s}]))}}));
    w3.eachRow(r=>r.eachCell((c,j)=>{if(j>2)c.numFmt="#,##0"}));

    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download="FG200_"+f+"_ถึง_"+t+".xlsx"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);

};

  $("e-grid").addEventListener("input",calc);
}
function readGrid(){return ALL.map((c,r)=>SIZES.map((s,i)=>Math.max(0,Math.round(Number($("g-"+r+"-"+i).value)||0))))}
function calc(){
  const g=readGrid(); let all=0;
  g.forEach((row,r)=>{const t=row.reduce((a,b)=>a+b,0);all+=t;$("gt-"+r).textContent=fmt(t)});
  SIZES.forEach((s,i)=>$("gc-"+i).textContent=fmt(g.reduce((a,row)=>a+row[i],0)));
  $("gg").textContent=fmt(all);
  const p=$("e-printed").value===""?null:Number($("e-printed").value), c=$("e-check");
  if(p===null){c.className="msg";c.textContent="กรอกยอดรวมที่พิมพ์ในรายงานเพื่อตรวจความถูกต้อง · ตอนนี้รวม "+all.toLocaleString("en-US")}
  else if(p===all){c.className="msg ok";c.textContent="ตรงกับยอดรวมในรายงาน ("+all.toLocaleString("en-US")+")"}
  else{c.className="msg warn";c.textContent="ไม่ตรง: ในรายงาน "+p.toLocaleString("en-US")+" แต่รวมได้ "+all.toLocaleString("en-US")+" (ต่าง "+(all-p).toLocaleString("en-US")+")"}
}
function fillGrid(iso){
  const d=docs[iso]; ALL.forEach((c,r)=>SIZES.forEach((s,i)=>{const v=d&&d.rows&&d.rows[c]?d.rows[c][i]:0;$("g-"+r+"-"+i).value=v?v:""}));
  $("e-printed").value=d&&d.printedTotal!=null?d.printedTotal:""; calc();
  $("e-msg").textContent=d?"วันนี้มีข้อมูลอยู่แล้ว กำลังแก้ไข":"วันใหม่ ยังไม่มีข้อมูล";
}
$("e-date").onchange=()=>{if($("e-date").value)fillGrid($("e-date").value)};
$("e-printed").oninput=calc;
$("e-clear").onclick=()=>{ALL.forEach((c,r)=>SIZES.forEach((s,i)=>$("g-"+r+"-"+i).value=""));$("e-printed").value="";calc()};
$("e-save").onclick=async()=>{
  const iso=$("e-date").value, m=$("e-msg");
  if(!iso){m.textContent="เลือกวันที่ก่อน";return}
  const key=$("e-key").value.trim(); if(!key){m.textContent="ใส่รหัสบันทึกก่อน";return}
  const g=readGrid(), rows={}; ALL.forEach((c,r)=>{if(g[r].some(x=>x))rows[c]=g[r]});
  const tot=g.flat().reduce((a,b)=>a+b,0), p=$("e-printed").value===""?null:Number($("e-printed").value);
  if(p!==null&&p!==tot&&!confirm_ok()){return}
  try{localStorage.setItem("fgkey",key)}catch(e){}
  $("e-save").disabled=true;
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key,date:iso,rows,printedTotal:p})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||"error");
    m.textContent="บันทึก "+thLong(iso)+" แล้ว รวม "+tot.toLocaleString("en-US")+" คู่"; await load();
  }catch(e){m.textContent="บันทึกไม่สำเร็จ: "+(e&&e.message||"error")}
  $("e-save").disabled=false;
};
let warned=null;
function confirm_ok(){ // no dialogs in the viewer: first click warns, second click on same date saves
  const k=$("e-date").value+"|"+readGrid().flat().join(",")+"|"+$("e-printed").value;
  if(warned===k) {warned=null;return true}
  warned=k;$("e-msg").textContent="ยอดรวมไม่ตรงกับรายงาน กด บันทึก อีกครั้งถ้าต้องการบันทึกทั้งที่ไม่ตรง";return false;
}
function tab(n){ ["q","e","p"].forEach(k=>{$("view-"+k).hidden=(k!==n);$("tab-"+k).setAttribute("aria-selected",k===n)});
  try{localStorage.setItem("fgtab",n)}catch(e){} }
$("tab-q").onclick=()=>tab("q"); $("tab-e").onclick=()=>tab("e"); $("tab-p").onclick=()=>tab("p");

/* ---------- plan tab ---------- */
const pid=(r,i)=>"p-"+r+"-"+i;
function buildPGrid(){
  let h='<table><thead><tr><th>สี</th>'+SIZES.map(s=>'<th>'+s+'</th>').join("")+'<th>รวม</th></tr></thead><tbody>';
  ALL.forEach((c,r)=>{h+='<tr><td><span class="dot" style="'+dotStyle(c)+';display:inline-block;margin-right:8px;vertical-align:-1px"></span>'+esc(lab(c))+'</td>'+
    SIZES.map((s,i)=>'<td><input type="number" min="0" step="1" id="'+pid(r,i)+'" aria-label="แผน '+esc(lab(c))+' เบอร์ '+s+'"></td>').join("")+'<td id="pt-'+r+'">–</td></tr>'});
  h+='</tbody><tfoot><tr><td>รวม</td>'+SIZES.map((s,i)=>'<td id="pc-'+i+'">–</td>').join("")+'<td id="pg">–</td></tr></tfoot></table>';
  $("p-grid").innerHTML=h; $("p-grid").addEventListener("input",pCalc);
}
const readPGrid=()=>ALL.map((c,r)=>SIZES.map((s,i)=>Math.max(0,Math.round(Number($(pid(r,i)).value)||0))));
const planSum=o=>Object.values(o||{}).reduce((a,v)=>a+v.reduce((x,y)=>x+y,0),0);
function pCalc(){
  const g=readPGrid(); let all=0;
  g.forEach((row,r)=>{const t=row.reduce((a,b)=>a+b,0);all+=t;$("pt-"+r).textContent=fmt(t)});
  SIZES.forEach((s,i)=>$("pc-"+i).textContent=fmt(g.reduce((a,row)=>a+row[i],0))); $("pg").textContent=fmt(all);
  const m=$("p-month").value, v=$("p-rev").value, rs=m?revNum(m):[], c=$("p-check");
  let prev=null; if(m&&rs.length){const lower=v==="new"?rs:rs.filter(x=>x<+v); if(lower.length){const pr=lower[lower.length-1]; prev={rev:pr,tot:planSum(PLANS[m][pr].colors)}}}
  c.className="msg"; c.textContent="รวมแผน "+all.toLocaleString("en-US")+" คู่"+(prev?" · ฉบับก่อนหน้า ("+(prev.rev===0?"แผนเริ่มต้น":"revise ครั้งที่ "+prev.rev)+") "+prev.tot.toLocaleString("en-US")+" คู่ · ต่าง "+(all-prev.tot>0?"+":"")+(all-prev.tot).toLocaleString("en-US")+" คู่":"");
  const nx=rs.length?rs[rs.length-1]+1:0;
  $("p-save").textContent=v==="new"||!m?("บันทึกเป็น "+(nx===0?"แผนเริ่มต้น":"revise ครั้งที่ "+nx)):("บันทึกทับ "+(+v===0?"แผนเริ่มต้น":"revise ครั้งที่ "+v));
}
function pRefreshRev(keep){
  const m=$("p-month").value, rs=m?revNum(m):[], nx=rs.length?rs[rs.length-1]+1:0;
  $("p-rev").innerHTML=rs.map(r=>'<option value="'+r+'">'+(r===0?"แผนเริ่มต้น":"revise ครั้งที่ "+r)+'</option>').join("")+'<option value="new">+ ฉบับใหม่ ('+(nx===0?"แผนเริ่มต้น":"revise ครั้งที่ "+nx)+')</option>';
  const opts=[...$("p-rev").options].map(o=>o.value);
  $("p-rev").value=(keep!=null&&opts.includes(String(keep)))?String(keep):(rs.length?String(rs[rs.length-1]):"new");
  pFill();
}
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function pFill(){
  const m=$("p-month").value, v=$("p-rev").value, rs=m?revNum(m):[]; let src={},date="",note="";
  if(m&&v==="new"){ if(rs.length) src=PLANS[m][rs[rs.length-1]].colors; date=todayISO(); }
  else if(m&&PLANS[m]&&PLANS[m][+v]){ const e=PLANS[m][+v]; src=e.colors; date=e.date; note=e.note }
  ALL.forEach((c,r)=>SIZES.forEach((s,i)=>{const x=src[c]?src[c][i]:0;$(pid(r,i)).value=x?x:""}));
  $("p-date").value=date; $("p-note").value=note; pCalc();
}
$("p-month").onchange=()=>pRefreshRev(); $("p-rev").onchange=pFill;
$("p-save").onclick=async()=>{
  const m=$("p-month").value, msg=$("p-msg"), key=$("p-key").value.trim();
  if(!m){msg.textContent="เลือกเดือนก่อน";return} if(!key){msg.textContent="ใส่รหัสบันทึกก่อน";return}
  const rs=revNum(m), v=$("p-rev").value, rev=v==="new"?(rs.length?rs[rs.length-1]+1:0):+v;
  const g=readPGrid(), rows={}; ALL.forEach((c,r)=>{if(g[r].some(x=>x))rows[c]=g[r]});
  if(!Object.keys(rows).length){msg.textContent="ยังไม่ได้กรอกแผน";return}
  try{localStorage.setItem("fgkey",key)}catch(e){}
  $("p-save").disabled=true;
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({type:"plan",key,month:m,rev,date:$("p-date").value,note:$("p-note").value.trim(),rows})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||"error");
    msg.textContent="บันทึกแผน "+mLabel(m)+" "+revName(rev)+" แล้ว"; await load(); pRefreshRev(rev);
  }catch(e){msg.textContent="บันทึกไม่สำเร็จ: "+(e&&e.message||"error")}
  $("p-save").disabled=false;
};

buildChips(); buildGrid(); buildPGrid(); calc(); render();
let first=true;
async function load(){
  try{
    const r=await fetch(API_URL); const j=await r.json(); const m={};
    (j.rows||[]).forEach(x=>{const d=normD(x[0]); if(!m[d]) m[d]={rows:{},printedTotal:null}; m[d].rows[x[1]]=x.slice(2,8).map(v=>Number(v)||0)});
    docs=m; PLANS=buildPlans(j.plan); loaded=true;
    const ds=dates();
    if(first&&ds.length){first=false;$("from").value=ds[0];$("to").value=ds[ds.length-1];$("e-date").value=ds[ds.length-1];fillGrid(ds[ds.length-1]);$("p-month").value=ds[ds.length-1].slice(0,7);pRefreshRev()}
    render();
  }catch(e){loaded=true;$("matrix").innerHTML='<div class="empty">อ่านข้อมูลไม่ได้ ตรวจ API_URL และการ Deploy</div>'}
}
try{$("e-key").value=localStorage.getItem("fgkey")||"";$("p-key").value=$("e-key").value}catch(e){}
load();
</script>
